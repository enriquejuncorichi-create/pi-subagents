name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Managed-worker recovery
        run: bun test integration/managed-recovery.test.ts

  # The fork requires the native managed-worker APIs present in Pi 0.87.0.
  # Check the advertised peer floor independently of the pinned dev dependency.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install floor Pi without changing package manifests
        run: bun add --no-save @earendil-works/pi-coding-agent@0.87.0 @earendil-works/pi-ai@0.87.0 @earendil-works/pi-tui@0.87.0
      - run: bun run typecheck
      - run: bun run test

  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install current Pi without changing package manifests
        run: bun add --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - run: bun run typecheck
      - run: bun run test
